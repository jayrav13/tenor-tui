[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenor-tui"
version = "0.1.0"
description = "A terminal UI for browsing stock options chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50",
    "yfinance>=0.2.30",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.scripts]
tenortui = "tenortui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pandas",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenortui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
