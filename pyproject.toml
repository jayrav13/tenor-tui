[tool.poetry]
name = "tenor-tui"
version = "0.1.0"
description = "A terminal UI for browsing stock options chains"
readme = "README.md"
packages = [{include = "tenortui", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
textual = ">=0.50"
yfinance = ">=0.2.30"
requests = ">=2.28"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
pytest-cov = ">=4.0"
pandas = "*"
ruff = ">=0.4"
pre-commit = ">=3.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5"

[tool.poetry.scripts]
tenortui = "tenortui.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
